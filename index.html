<title>Madness Pool 2026 — Rooting Dashboard</title>

<style>
:root {
  --bg: #0a0a0f;
  --card: #14141f;
  --card-border: #1e1e2e;
  --text: #e8e8ed;
  --text-dim: #7a7a8e;
  --accent-orange: #ff6b35;
  --accent-gold: #ffd700;
  --accent-green: #22c55e;
  --accent-red: #ef4444;
  --accent-blue: #3b82f6;
  --accent-purple: #a855f7;
  --fooman: #ff6b35;
  --slosh: #ef4444;
  --amanda: #3b82f6;
  --work: #a855f7;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Source Sans 3', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
.grain {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 9999;
}
header {
  padding: 24px 28px 16px;
  border-bottom: 1px solid var(--card-border);
  background: linear-gradient(180deg, #12121a 0%, var(--bg) 100%);
}
header h1 {
  font-family: 'Oswald', sans-serif;
  font-size: 28px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 3px;
  background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
header p {
  color: var(--text-dim);
  font-size: 13px;
  margin-top: 4px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.bracket-bar {
  display: flex;
  gap: 8px;
  padding: 16px 28px;
  overflow-x: auto;
  border-bottom: 1px solid var(--card-border);
}
.bracket-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--card-border);
  white-space: nowrap;
  flex-shrink: 0;
}
.bracket-chip .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.bracket-chip .name {
  font-family: 'Oswald', sans-serif;
  font-size: 14px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.bracket-chip .champ {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 400;
}
.priority-label {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.tabs {
  display: flex;
  padding: 0 28px;
  border-bottom: 1px solid var(--card-border);
}
.tab {
  padding: 14px 20px;
  font-family: 'Oswald', sans-serif;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab.active {
  color: var(--accent-orange);
  border-bottom-color: var(--accent-orange);
}
.tab:hover { color: var(--text); }
.content { padding: 20px 20px 100px; }
.day-header {
  font-family: 'Oswald', sans-serif;
  font-size: 20px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 12px 8px;
  color: var(--accent-gold);
}
.game-card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  margin-bottom: 10px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.game-card:hover { border-color: #2e2e44; }
.game-card.priority-high { border-left: 3px solid var(--accent-gold); }
.game-card.priority-med { border-left: 3px solid var(--accent-orange); }
.game-card.priority-low { border-left: 3px solid var(--card-border); }
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
}
.game-header:hover { background: rgba(255,255,255,0.02); }
.game-time {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 600;
  width: 70px;
  flex-shrink: 0;
}
.game-matchup {
  flex: 1;
  font-family: 'Oswald', sans-serif;
  font-size: 15px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.game-matchup .seed { color: var(--text-dim); font-weight: 400; font-size: 12px; }
.game-matchup .vs { color: var(--text-dim); font-size: 12px; margin: 0 4px; }
.game-tv {
  font-size: 11px;
  color: var(--text-dim);
  padding: 3px 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.05);
  flex-shrink: 0;
  margin-left: 8px;
}
.root-badge {
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-left: 8px;
  flex-shrink: 0;
}
.root-badge.unanimous { background: rgba(34,197,94,0.15); color: var(--accent-green); }
.root-badge.majority { background: rgba(255,107,53,0.15); color: var(--accent-orange); }
.root-badge.split { background: rgba(122,122,142,0.15); color: var(--text-dim); }
.game-details {
  display: none;
  padding: 0 16px 14px;
  border-top: 1px solid var(--card-border);
}
.game-details.open { display: block; padding-top: 12px; }
.bracket-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  font-size: 13px;
}
.bracket-row .b-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.bracket-row .b-name {
  font-weight: 600;
  width: 70px;
  flex-shrink: 0;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.bracket-row .b-pick {
  font-weight: 600;
  width: 100px;
  flex-shrink: 0;
}
.bracket-row .b-path {
  color: var(--text-dim);
  font-size: 12px;
}
.path-tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  margin-left: 4px;
  text-transform: uppercase;

.path-tag.champ { background: rgba(255,215,0,0.2); color: var(--accent-gold); }
.path-tag.ff { background: rgba(255,107,53,0.15); color: var(--accent-orange); }
.path-tag.e8 { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
.path-tag.s16 { background: rgba(122,122,142,0.1); color: var(--text-dim); }
.path-tag.r32 { background: rgba(122,122,142,0.06); color: #555; }
.root-summary {
  background: rgba(255,107,53,0.08);
  border: 1px solid rgba(255,107,53,0.2);
  border-radius: 8px;
  padding: 8px 12px;
  margin-top: 8px;
  font-size: 13px;
}
.root-summary strong { color: var(--accent-orange); }
.priority-section {

.priority-title {

  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-dim);
  padding: 8px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.priority-title .star { color: var(--accent-gold); }
.hidden { display: none; }
</style>

function pathLabel(path) {
  var map = {
    "R32": '<span class="path-tag r32">R32</span>',
    "S16": '<span class="path-tag s16">S16</span>',
    "E8": '<span class="path-tag e8">E8</span>',
    "FF": '<span class="path-tag ff">F4</span>',
    "SHIP": '<span class="path-tag ff">Finals</span>',
    "CHAMP": '<span class="path-tag champ">CHAMP</span>'
  };
  return map[path] || path;
}

function renderGames(day) {
  var list = games[day];
  var highGames = [];
  var medGames = [];
  var lowGames = [];
  for (var i = 0; i < list.length; i++) {
    if (list[i].priority === "high") highGames.push(list[i]);
    else if (list[i].priority === "med") medGames.push(list[i]);
    else lowGames.push(list[i]);
  }

  var html = '';

  if (highGames.length) {
    html += '<div class="priority-section">';
    html += '<div class="priority-title"><span class="star">★★★</span> MUST-WATCH GAMES</div>';
    for (var i = 0; i < highGames.length; i++) html += renderCard(highGames[i]);
    html += '</div>';
  }
  if (medGames.length) {
    html += '<div class="priority-section">';
    html += '<div class="priority-title"><span class="star">★★</span> IMPORTANT GAMES</div>';
    for (var i = 0; i < medGames.length; i++) html += renderCard(medGames[i]);
    html += '</div>';
  }
  if (lowGames.length) {
    html += '<div class="priority-section">';
    html += '<div class="priority-title"><span class="star">★</span> OTHER GAMES</div>';
    for (var i = 0; i < lowGames.length; i++) html += renderCard(lowGames[i]);
    html += '</div>';
  }
  return html;
}

function renderCard(g) {
  var id = g.team1.replace(/[^a-z]/gi,'') + g.team2.replace(/[^a-z]/gi,'');
  var html = '<div class="game-card priority-' + g.priority + '">';
  html += '<div class="game-header" onclick="toggleDetails(\'' + id + '\')">';
  html += '<div class="game-time">' + g.time + '</div>';
  html += '<div class="game-matchup"><span class="seed">(' + g.seed1 + ')</span> ' + g.team1 + ' <span class="vs">vs</span> <span class="seed">(' + g.seed2 + ')</span> ' + g.team2 + '</div>';
  html += '<span class="root-badge ' + g.rootType + '">' + g.root + '</span>';
  html += '<span class="game-tv">' + g.tv + '</span>';
  html += '</div>';
  html += '<div class="game-details" id="details-' + id + '">';
  for (var i = 0; i < g.picks.length; i++) {
    var p = g.picks[i];
    html += '<div class="bracket-row">';
    html += '<div class="b-dot" style="background:' + p.color + '"></div>';
    html += '<div class="b-name" style="color:' + p.color + '">' + p.bracket + '</div>';
    html += '<div class="b-pick">' + p.pick + '</div>';
    html += '<div class="b-path">→ ' + pathLabel(p.path) + '</div>';
    html += '</div>';
  }
  html += '<div class="root-summary"><strong>Root for:</strong> ' + g.rootNote + '</div>';
  html += '</div></div>';
  return html;
}

function toggleDetails(id) {
  var el = document.getElementById('details-' + id);
  if (el.classList.contains('open')) el.classList.remove('open');
  else el.classList.add('open');
}

function showTab(day) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  if (day === 'thursday') tabs[0].classList.add('active');
  else tabs[1].classList.add('active');
  document.getElementById('content').innerHTML = renderGames(day);
}

showTab('thursday');
